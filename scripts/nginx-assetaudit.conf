server {
    listen 80;
    listen [::]:80;
    server_name assetaudit.uz www.assetaudit.uz;

    client_max_body_size 50M;

    # Gzip siqish
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Next.js statik fayllari uchun tezkor kesh
    location /_next/static/ {
        alias /var/www/assetaudit/standalone/.next/static/;
        expires 365d;
        access_log off;
    }

    # Public resurslar
    location /public/ {
        alias /var/www/assetaudit/standalone/public/;
        expires 30d;
        access_log off;
    }

    # Barcha so'rovlarni Next.js Standalone serveriga yo'naltirish
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

