name: AssetAudit Standalone Release Packager

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Reliz tegi (masalan: v1.0.0)"
        required: false
        default: "v0.1.0"
  release:
    types: [created]

jobs:
  build-and-package:
    name: Linux Standalone Bundle & Checksum
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Node.js 24 LTS muhitini o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Bog'liqliklarni o'rnatish
        run: npm ci

      - name: TypeScript tekshiruvi
        run: npx tsc --noEmit

      - name: Standalone reliz paketini yig'ish
        env:
          BETTER_AUTH_SECRET: placeholder_secret_for_standalone_build_minimum_32_chars
          BETTER_AUTH_URL: https://assetaudit.uz
          NEXT_PUBLIC_APP_URL: https://assetaudit.uz
          NODE_ENV: production
        run: npm run build

      - name: Linux Standalone paketini arxivlash
        run: |
          cd .next/standalone
          tar -czf ../../assetaudit-linux-x64.tar.gz .
          cd ../..
          sha256sum assetaudit-linux-x64.tar.gz > assetaudit-linux-x64.tar.gz.sha256

      - name: Reliz artefaktini yuklash
        uses: actions/upload-artifact@v4
        with:
          name: assetaudit-linux-x64-bundle
          path: |
            assetaudit-linux-x64.tar.gz
            assetaudit-linux-x64.tar.gz.sha256
