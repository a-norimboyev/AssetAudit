name: AssetAudit CI (Lint, Typecheck, Test & Build)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Node.js 24 LTS muhitini o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Toza bog'liqliklarni o'rnatish
        run: npm ci

      - name: TypeScript tekshiruvi (tsc --noEmit)
        run: npx tsc --noEmit

      - name: ESLint qoidalari tekshiruvi (npm run lint)
        run: npm run lint

  test-and-build:
    name: Database Integrity, Security Tests & Production Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_test_password
          POSTGRES_DB: mulknazorat_sprint05b_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Node.js 24 LTS muhitini o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Toza bog'liqliklarni o'rnatish
        run: npm ci

      - name: Izolyatsiyalangan .env.test yaratish
        run: |
          cat << 'EOF' > .env.test
          DATABASE_URL=postgresql://postgres:postgres_ci_test_password@127.0.0.1:5433/mulknazorat_sprint05b_test
          BETTER_AUTH_SECRET=ci_test_better_auth_secret_with_more_than_32_characters_high_entropy
          BETTER_AUTH_URL=http://localhost:3000
          NODE_ENV=test
          EOF

      - name: Drizzle SQL migratsiyalarini qo'llash (run-production-migrations.ts)
        env:
          DATABASE_URL: postgresql://postgres:postgres_ci_test_password@127.0.0.1:5433/mulknazorat_sprint05b_test
          NODE_ENV: test
        run: npx tsx scripts/run-production-migrations.ts

      - name: Testlarni bajarish (npm test)
        env:
          DATABASE_URL: postgresql://postgres:postgres_ci_test_password@127.0.0.1:5433/mulknazorat_sprint05b_test
          BETTER_AUTH_SECRET: ci_test_better_auth_secret_with_more_than_32_characters_high_entropy
          BETTER_AUTH_URL: http://localhost:3000
          NODE_ENV: test
        run: npm test

      - name: Production Standalone Build (npm run build)
        env:
          DATABASE_URL: postgresql://postgres:postgres_ci_test_password@127.0.0.1:5433/mulknazorat_sprint05b_test
          BETTER_AUTH_SECRET: ci_test_better_auth_secret_with_more_than_32_characters_high_entropy
          BETTER_AUTH_URL: https://assetaudit.uz
          NEXT_PUBLIC_APP_URL: https://assetaudit.uz
          NODE_ENV: production
        run: npm run build
