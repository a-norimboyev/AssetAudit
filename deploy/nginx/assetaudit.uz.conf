# ==============================================================================
# AssetAudit (assetaudit.uz) — Nginx Production Reverse Proxy Konfiguratsiyasi
# Eskiz VPS (1 GB RAM, Ubuntu 24.04 / Debian) uchun optimallashtirilgan
# ==============================================================================

# Rate limiting zonalari:
# NAT va korporativ/universitet tarmoqlarida (masalan, TATU binosidagi yuzlab xodimlar bitta umumiy
# tashqi IP orqali kirganda) qonuniy foydalanuvchilar bloklanib qolmasligi uchun optimal parametrlar:
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=180r/m;

# Next.js Standalone Server Upstream (systemd orqali 3000-portda ishlaydi)
upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server — Barcha so'rovlarni majburiy HTTPS ga yo'naltirish (Port 80)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name assetaudit.uz www.assetaudit.uz;

    # Certbot ACME webroot challenge uchun ruxsat
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Barcha boshqa HTTP so'rovlarni HTTPS ga 301 Permanent Redirect qilish
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server — Asosiy xavfsiz server (Port 443)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name assetaudit.uz www.assetaudit.uz;

    # SSL Sertifikatlari (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/assetaudit.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assetaudit.uz/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Zamonaviy SSL protokollari va shifrlash usullari (A+ SSL Labs reytingi)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Dastlabki HTTPS xavfsizligi:
    # MUHIM: Barcha tegishli subdomenlar (mail, vpn va h.k.) to'liq HTTPS ga o'tmasdan turib
    # 'includeSubDomains' yoki 'preload' qo'shilmaydi. Faqat asosiy domen HSTS faollashtiriladi.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Mobil kameradan QR skanerlash uchun ruxsat
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Yuklanadigan maksimal fayl hajmi (Suratlar va Excel/CSV import uchun)
    client_max_body_size 5M;

    # Gzip siqish sozlamalari (Trafik va yuklanish tezligini tejash)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # Next.js Statik Fayllarini Nginx orqali bevosita keshlab uzatish
    # --------------------------------------------------------------------------
    location /_next/static/ {
        alias /var/www/assetaudit/current/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /public/ {
        alias /var/www/assetaudit/current/public/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # --------------------------------------------------------------------------
    # Doimiy Rasm Yuklash Jildi — Qat'iy Xavfsizlik va Private Media Himoyasi
    # --------------------------------------------------------------------------
    # 1. To'g'ridan-to'g'ri /uploads/ ga kelgan ommaviy so'rovlar qat'iy 403 bilan to'xtatiladi
    location /uploads/ {
        deny all;
        return 403;
    }

    # 2. X-Accel-Redirect ichki lokatsiyasi: faqat Next.js ning /api/media/ marshruti
    # foydalanuvchi sessiyasi va tashkilotini (tenant) tekshirgandan keyingina ruxsat beradi
    location /internal-uploads/ {
        internal;
        alias /var/lib/assetaudit/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox;" always;
        add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;

        # Skript ijrosini Nginx darajasida bloklash
        location ~* \.(php|phtml|pl|py|cgi|sh|bash|exe|jsp|asp|aspx|bin)$ {
            return 403;
        }
    }

    # --------------------------------------------------------------------------
    # Health Check Endpoint (Monitoring uchun, ortiqcha log yozmaslik)
    # --------------------------------------------------------------------------
    location /api/health {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Autentifikatsiya va Login marshrutlari (Brute-Force Rate Limiting)
    # --------------------------------------------------------------------------
    location /api/auth/ {
        limit_req zone=auth_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Asosiy Dinamik Marshrut (Next.js Standalone Reverse Proxy)
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Xato sahifalari
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/html;
    }
}
